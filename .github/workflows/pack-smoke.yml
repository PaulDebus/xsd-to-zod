name: Pack smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pack-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The smoke script installs the packed tarball in a pnpm consumer project
      # (with an isolated node linker), so pnpm is required here.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: npm ci
      - run: npm run build
      - run: node scripts/pack-smoke.mjs
